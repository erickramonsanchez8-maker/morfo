<style>
/* ===== Tokens (ajustar con los hex oficiales) ===== */
:root{
  --guinda:#5A1028; --guinda-claro:#76213D; --oro:#C9A65C; --oro-oscuro:#8A6D2F;
  --carbon:#343033; --carbon-2:#211b1f; --claro:#F8F5EF; --tinta:#292427; --gris:#70696c;
  --vino:#5A1028; --vino-profundo:#350817; --vino-rico:#76213D; --vino-luz:#A64C65; --vino-polvo:#E7D8D9;
  --gris-mineral:#777276; --gris-piedra:#aaa3a2; --gris-niebla:#d9d4d0; --gris-carbon:#343033; --gris-fondo:#e9e5e1;
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --sans:"Work Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{font-family:var(--sans);color:var(--tinta);background:var(--claro);line-height:1.6;font-size:1rem}
img{max-width:100%;display:block}
a{color:inherit}
:focus-visible{outline:3px solid var(--oro);outline-offset:3px}
.wrap{width:min(1120px,100% - 2.5rem);margin-inline:auto}
h1,h2,h3{font-family:var(--serif);font-weight:500;line-height:1.1}
h2{font-size:clamp(2rem,4.5vw,3.2rem);margin-bottom:1.25rem}
p{max-width:62ch}
.dark{background:var(--carbon);color:#EDE8DF}
.dark h2{color:var(--oro)}
section{padding:clamp(4rem,9vw,7rem) 0}

/* Aviso de versión */
.ver{background:var(--carbon-2);color:#bdb6aa;font-size:.8rem;text-align:center;padding:.4rem 1rem}

/* Cabecera */
header.top{position:sticky;top:0;z-index:20;background:rgba(35,35,37,.96);backdrop-filter:blur(6px);color:#EDE8DF;border-bottom:1px solid rgba(201,166,92,.25)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:1rem;min-height:64px}
.brand{font-family:var(--serif);font-size:1.7rem;letter-spacing:.06em;color:var(--oro);text-decoration:none;font-weight:600}
.brand small{font-size:1.05rem;letter-spacing:.12em;margin-left:.35rem;color:#EDE8DF;font-weight:500}
nav ul{display:flex;gap:1.5rem;list-style:none;padding:0}
nav a{text-decoration:none;font-size:.95rem;padding:.4rem 0;border-bottom:1px solid transparent}
nav a:hover{border-color:var(--oro)}
.lang{display:flex;gap:.25rem}
.lang button{background:none;border:1px solid rgba(201,166,92,.5);color:#EDE8DF;padding:.3rem .65rem;font:inherit;font-size:.85rem;cursor:pointer;border-radius:2px}
.lang button[aria-pressed=true]{background:var(--oro);color:var(--carbon-2);border-color:var(--oro)}
.menu{display:none;background:none;border:1px solid rgba(201,166,92,.5);color:#EDE8DF;padding:.35rem .7rem;font:inherit;cursor:pointer;border-radius:2px}
@media(max-width:820px){
  .menu{display:block}
  nav{position:absolute;inset:100% 0 auto 0;background:var(--carbon-2);display:none;padding:1rem 1.25rem 1.5rem}
  nav.open{display:block}
  nav ul{flex-direction:column;gap:.5rem}
  .bar{flex-wrap:wrap}
}

/* Portada */
.hero{background:var(--carbon);color:#EDE8DF;padding:clamp(2.5rem,6vw,5rem) 0 clamp(4rem,8vw,6rem);overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.05fr 1fr;gap:2rem;align-items:center}
.hero-logo{justify-self:center;width:min(520px,100%)}
.hero-logo img{width:100%;height:auto;-webkit-mask-image:radial-gradient(closest-side,#000 68%,transparent 100%);mask-image:radial-gradient(closest-side,#000 68%,transparent 100%)}
.hero h1{font-size:clamp(2.4rem,5.6vw,4.4rem);color:#F3EEE4;margin-bottom:1.25rem}
.hero p{color:#cfc8bb;margin-bottom:2rem;font-size:1.08rem}
.btn{display:inline-block;background:var(--guinda);color:#fff;text-decoration:none;padding:.85rem 1.6rem;border:1px solid var(--oro);border-radius:2px;font-weight:500;cursor:pointer;font-family:var(--sans);font-size:1rem}
.btn:hover{background:var(--guinda-claro)}
.btn.ghost{background:none;border-color:currentColor}
@media(max-width:820px){.hero .wrap{grid-template-columns:1fr}.hero-logo{order:-1;width:min(340px,80%)}}
@media(prefers-reduced-motion:no-preference){.hero-logo img{animation:rev 1.6s ease-out both}@keyframes rev{from{opacity:0;filter:blur(8px)}to{opacity:1;filter:none}}}

/* Marcos de obra */
.frame{aspect-ratio:4/5;background:#e9e4dc;border:1px dashed #b9b0a2;display:grid;place-items:center;text-align:center;padding:1.5rem;color:var(--gris);font-size:.92rem;width:100%}
.frame img{width:100%;height:100%;object-fit:cover}
.badge{display:inline-block;border:1px solid var(--guinda);color:var(--guinda);padding:.25rem .7rem;font-size:.88rem;border-radius:2px;font-weight:500}

/* Destacada */
.feat{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(2rem,6vw,5rem);align-items:center}
.feat h2{margin-bottom:.5rem}
.meta{color:var(--gris);margin-bottom:1.25rem}
.feat .badge{margin-bottom:1.5rem}
@media(max-width:820px){.feat{grid-template-columns:1fr}}

/* Catálogo */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:2rem}
.card{text-decoration:none;display:block}
.card h3{font-size:1.6rem;margin:.9rem 0 .15rem}
.card p{color:var(--gris);font-size:.92rem}
.card:hover h3{color:var(--guinda)}

/* Artista */
.artist{display:grid;grid-template-columns:5fr 6fr;gap:clamp(2rem,6vw,5rem)}
blockquote{font-family:var(--serif);font-size:clamp(1.7rem,3.4vw,2.5rem);line-height:1.2;color:#F3EEE4;border-left:3px solid var(--guinda-claro);padding-left:1.25rem}
.artist p+p{margin-top:1rem}
.refs{margin-top:1.5rem;color:#cfc8bb;font-size:.95rem}
.pend{display:inline-block;margin-top:1.5rem;font-size:.85rem;color:var(--oro);border:1px dashed var(--oro);padding:.25rem .6rem}
@media(max-width:820px){.artist{grid-template-columns:1fr}}

/* Subastas */
.empty{border:1px solid #d6cdbf;padding:clamp(1.5rem,4vw,3rem);max-width:720px}
.empty h3{font-size:1.8rem;margin-bottom:.5rem}
form.inline{display:flex;flex-wrap:wrap;gap:.75rem;margin-top:1.25rem}

/* Formularios */
label{display:block;font-size:.92rem;margin-bottom:.3rem;font-weight:500}
input,textarea,select{font:inherit;width:100%;padding:.7rem .8rem;border:1px solid #9d9588;background:#fff;color:var(--tinta);border-radius:2px}
.dark input,.dark textarea,.dark select{background:var(--carbon-2);border-color:#7b756b;color:#EDE8DF}
.field{margin-bottom:1rem}
.hp{position:absolute;left:-9999px}
.note{margin-top:.75rem;font-size:.9rem;color:var(--gris)}
.dark .note{color:#bdb6aa}
.contact{display:grid;grid-template-columns:1fr 1.2fr;gap:clamp(2rem,6vw,5rem)}
@media(max-width:820px){.contact{grid-template-columns:1fr}}

/* FAQ */
details{border-bottom:1px solid #d6cdbf;padding:1rem 0;max-width:760px}
summary{cursor:pointer;font-weight:500;font-size:1.05rem}
details p{margin-top:.6rem;color:#4b4547}

/* Ficha de obra */
#detail{display:none}
body.in-detail #home{display:none}
body.in-detail #detail{display:block}
.back{display:inline-block;margin-bottom:2rem;color:var(--gris)}
.sheet{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,5fr);gap:clamp(2rem,6vw,5rem)}
.sheet h1{font-size:clamp(2.4rem,5vw,4rem);margin-bottom:.5rem}
dl{display:grid;grid-template-columns:auto 1fr;gap:.5rem 1.5rem;margin:1.5rem 0;border-top:1px solid #d6cdbf;padding-top:1.25rem}
dt{color:var(--gris)}
dd{font-weight:500}
.story h2{font-size:1.9rem;margin:1.5rem 0 .5rem}
@media(max-width:820px){.sheet{grid-template-columns:1fr}}

footer{background:var(--carbon-2);color:#bdb6aa;padding:3rem 0;font-size:.92rem}
footer ul{list-style:none;padding:0;display:flex;flex-wrap:wrap;gap:.5rem 1.5rem;margin:1rem 0}
footer .brand{font-size:1.5rem}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}

/* ===== Dirección de arte: lujo silencioso, galería parisina ===== */
:root{--oro-luz:#e4cc91;--papel:#f8f5ef;--linea:rgba(201,166,92,.28);--ease-luxe:cubic-bezier(.22,.68,0,1)}
body{letter-spacing:.005em}
::selection{background:var(--oro);color:var(--carbon-2)}
.ver{letter-spacing:.19em;text-transform:uppercase;font-size:.66rem;padding:.58rem 1rem;color:#d8c7a0}
header.top{background:rgba(35,35,37,.91);border-bottom:1px solid var(--linea);transition:background .35s ease,box-shadow .35s ease}
header.top.scrolled{background:rgba(25,25,26,.98);box-shadow:0 12px 35px rgba(0,0,0,.18)}
.bar{min-height:76px}
.brand{display:inline-flex;align-items:center;gap:.65rem;text-decoration:none;line-height:1}
.brand-mark{width:40px;height:40px;object-fit:contain;filter:drop-shadow(0 0 10px rgba(201,166,92,.12));transition:transform .8s var(--ease-luxe),filter .4s ease}
.brand:hover .brand-mark{transform:rotate(-8deg) scale(1.06);filter:drop-shadow(0 0 12px rgba(201,166,92,.4))}
.brand-word{font-family:var(--serif);font-size:1.7rem;letter-spacing:.1em;color:var(--oro);font-weight:600}
.brand-word small{font-family:var(--sans);font-size:.67rem;letter-spacing:.22em;text-transform:uppercase;margin-left:.42rem;color:#e9e2d6;font-weight:400}
nav a{position:relative;letter-spacing:.045em;font-size:.78rem;text-transform:uppercase}
nav a:after{content:"";position:absolute;left:0;right:100%;bottom:-3px;height:1px;background:var(--oro);transition:right .35s var(--ease-luxe)}
nav a:hover{border-color:transparent}
nav a:hover:after{right:0}
.lang button{transition:background .25s ease,color .25s ease,border-color .25s ease}
.hero{position:relative;isolation:isolate;background:radial-gradient(ellipse at 78% 40%,rgba(107,18,48,.19),transparent 43%),linear-gradient(120deg,#252527 0%,#303032 55%,#242426 100%);padding-top:clamp(3rem,7vw,6rem);padding-bottom:2.5rem}
.hero:before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(420px circle at var(--pointer-x,75%) var(--pointer-y,45%),rgba(201,166,92,.09),transparent 72%)}
.hero:after{content:"";position:absolute;z-index:-1;inset:22px;pointer-events:none;border:1px solid rgba(201,166,92,.10);mask-image:linear-gradient(90deg,#000,transparent 55%,#000)}
.hero .wrap{position:relative;z-index:1}
.hero-copy{padding:1.5rem 0 2rem}
.eyebrow{font-size:.7rem!important;text-transform:uppercase;letter-spacing:.24em;color:var(--oro)!important;margin-bottom:1.7rem!important;display:flex;align-items:center;gap:.8rem}
.eyebrow:before{content:"";width:34px;height:1px;background:var(--oro);display:inline-block}
.hero h1{max-width:10ch;font-size:clamp(3.2rem,6.7vw,6.3rem);letter-spacing:-.035em;line-height:.94;margin-bottom:1.6rem}
.hero p:not(.eyebrow){max-width:43ch;font-size:1rem;line-height:1.9;color:#d4cbbd}
.hero .btn{margin-top:.2rem}
.btn{position:relative;overflow:hidden;letter-spacing:.08em;text-transform:uppercase;font-size:.75rem;padding:1rem 1.55rem;transition:transform .35s var(--ease-luxe),background .35s ease,box-shadow .35s ease}
.btn:before{content:"";position:absolute;inset:0;transform:translateX(-120%);background:linear-gradient(105deg,transparent,rgba(255,255,255,.18),transparent);transition:transform .75s var(--ease-luxe)}
.btn:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(0,0,0,.18)}
.btn:hover:before{transform:translateX(120%)}
.hero-logo{position:relative;animation:hero-arrive 1.3s var(--ease-luxe) both}
.hero-logo:before{content:"";position:absolute;inset:9%;border:1px solid rgba(201,166,92,.22);border-radius:50%;animation:halo-turn 32s linear infinite}
.hero-logo:after{content:"M";position:absolute;right:4%;bottom:8%;font-family:var(--serif);font-size:clamp(2rem,4vw,4rem);font-style:italic;color:rgba(201,166,92,.55);line-height:1}
.hero-logo img{position:relative;z-index:1;width:100%;max-height:560px;object-fit:contain;filter:drop-shadow(0 18px 36px rgba(0,0,0,.12));-webkit-mask-image:none;mask-image:none;animation:logo-breathe 7s ease-in-out infinite}
.hero-signature{display:flex;align-items:center;gap:1rem;padding-top:1.4rem;color:#b8ab92;font-size:.6rem;letter-spacing:.22em}
.signature-line{height:1px;max-width:150px;flex:1;background:linear-gradient(90deg,var(--oro),transparent)}
section{position:relative}
#destacada{background:var(--papel)}
#obras{background:#eee8de!important}
#destacada .frame{border:0;background:#e5ded3;box-shadow:0 22px 60px rgba(48,36,25,.08)}
.frame{position:relative;overflow:hidden;border:1px solid rgba(138,109,47,.25);background:linear-gradient(135deg,#eee7dc,#e4dbcf);transition:box-shadow .6s ease,transform .6s var(--ease-luxe)}
.frame:after{content:"";position:absolute;inset:10px;border:1px solid rgba(138,109,47,.22);pointer-events:none;transition:inset .55s var(--ease-luxe),border-color .4s ease}
.card:hover .frame{transform:translateY(-5px);box-shadow:0 20px 45px rgba(48,36,25,.12)}
.card:hover .frame:after{inset:16px;border-color:rgba(138,109,47,.55)}
.frame img{transition:transform 1s var(--ease-luxe),filter .6s ease}
.card:hover .frame img{transform:scale(1.035);filter:saturate(1.04)}
.badge{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;border-color:var(--oro-oscuro);padding:.35rem .7rem}
#obras h2,#faq h2{letter-spacing:-.025em}
#artista{background:radial-gradient(ellipse at 10% 20%,rgba(107,18,48,.18),transparent 38%),var(--carbon)}
blockquote{border-left-color:var(--oro);font-style:italic}
#subastas .empty{border-color:rgba(138,109,47,.4);background:rgba(255,255,255,.22)}
details{transition:border-color .3s ease}
details[open]{border-color:var(--oro-oscuro)}
summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:1rem}
summary::-webkit-details-marker{display:none}
summary:after{content:"+";font-family:var(--serif);font-size:1.5rem;color:var(--oro-oscuro);transition:transform .3s ease}
details[open] summary:after{transform:rotate(45deg)}
#contacto{background:radial-gradient(ellipse at 85% 25%,rgba(107,18,48,.18),transparent 38%),var(--carbon)}
input,textarea,select{border-color:#b9ae9c;transition:border-color .25s ease,box-shadow .25s ease}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--oro-oscuro);box-shadow:0 0 0 3px rgba(201,166,92,.14)}
footer{border-top:1px solid rgba(201,166,92,.2)}
.footer-brand{margin-bottom:1.2rem}
footer a:not(.brand){text-decoration:none;transition:color .25s ease}
footer a:not(.brand):hover{color:var(--oro-luz)}
/* Animaciones de aparición discretas */
.js-motion .reveal{opacity:0;transform:translateY(22px);transition:opacity .85s var(--ease-luxe),transform .85s var(--ease-luxe)}
.js-motion .reveal.is-visible{opacity:1;transform:translateY(0)}
.js-motion .reveal-delay-1{transition-delay:.12s}
.js-motion .reveal-delay-2{transition-delay:.24s}
.js-motion .reveal-delay-3{transition-delay:.36s}
#reading-progress{position:fixed;z-index:100;top:0;left:0;height:2px;width:0;background:linear-gradient(90deg,var(--guinda-claro),var(--oro-luz));box-shadow:0 0 10px rgba(201,166,92,.45);pointer-events:none}
@keyframes hero-arrive{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes logo-breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes halo-turn{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@media(max-width:820px){
 .bar{min-height:68px}.brand-mark{width:34px;height:34px}.brand-word{font-size:1.45rem}
 .hero{padding-bottom:1.5rem}.hero:after{inset:10px}
 .hero h1{max-width:12ch;font-size:clamp(3rem,12vw,4.8rem)}
 .hero-copy{padding:0 0 1.5rem}.hero-logo{width:min(360px,84%)}
 .hero-signature{font-size:.52rem;letter-spacing:.12em;gap:.6rem}
 nav{box-shadow:0 18px 28px rgba(0,0,0,.2)}
}
@media(prefers-reduced-motion:reduce){
 .hero-logo,.hero-logo img,.hero-logo:before{animation:none!important}
 .js-motion .reveal{opacity:1;transform:none;transition:none}
 .btn:before{display:none}
}


/* ===== Sistema cromático MORFO: vino de colección ===== */
:root{
  --vino:#5A1028;
  --vino-profundo:#350817;
  --vino-rico:#76213D;
  --vino-luz:#A64C65;
  --vino-polvo:#E7D8D9;
  --vino-vidrio:rgba(90,16,40,.28);
}
::selection{background:var(--vino);color:#fff8f0}
.ver{
  background:linear-gradient(90deg,#260611 0%,#431024 48%,#260611 100%);
  border-bottom:1px solid rgba(201,166,92,.2);
}
header.top{border-bottom-color:rgba(166,76,101,.35)}
nav a:after{background:linear-gradient(90deg,var(--vino-luz),var(--oro-luz))}

.hero{
  background:
    radial-gradient(ellipse at 80% 44%,rgba(118,33,61,.42),transparent 38%),
    radial-gradient(ellipse at 7% 100%,rgba(90,16,40,.28),transparent 43%),
    linear-gradient(118deg,#211d20 0%,#292327 48%,#211d20 100%);

  background:
    radial-gradient(420px circle at var(--pointer-x,75%) var(--pointer-y,45%),rgba(201,166,92,.10),transparent 72%),

}
.eyebrow{color:#d9a8b5!important}
.eyebrow:before{background:linear-gradient(90deg,var(--vino-luz),var(--oro))}

.hero-logo:before{border-color:rgba(166,76,101,.32);box-shadow:0 0 65px rgba(90,16,40,.12)}
.hero-signature{color:#c7a9ad}
.signature-line{background:linear-gradient(90deg,var(--vino-luz),var(--oro),transparent)}

  background:linear-gradient(110deg,#f8f5ef 0%,#f8f5ef 65%,#f0e5e5 100%);
}

  background:linear-gradient(145deg,rgba(90,16,40,.05),transparent 42%,rgba(201,166,92,.08));
}
#obras{background:linear-gradient(135deg,#eee8de 0%,#eee8de 72%,#e9dfe0 100%)!important}
.card{position:relative}
.card h3{transition:color .35s ease,transform .45s var(--ease-luxe)}

.card:hover p{color:#5b4148}
.badge{border-color:var(--vino-rico);color:var(--vino);background:rgba(90,16,40,.035)}
#artista{
  background:
    radial-gradient(ellipse at 7% 16%,rgba(118,33,61,.34),transparent 42%),
    radial-gradient(ellipse at 96% 92%,rgba(90,16,40,.25),transparent 40%),
    linear-gradient(120deg,#272326,#2b2428 60%,#211d20);
}
blockquote{border-left-color:var(--vino-luz)}

  border-color:rgba(90,16,40,.28);
  background:linear-gradient(125deg,rgba(90,16,40,.055),rgba(255,255,255,.32) 65%);
  box-shadow:0 18px 45px rgba(53,8,23,.035);
}
summary:after{color:var(--vino-rico)}
details[open]{border-color:var(--vino-rico)}
#contacto{
  background:
    radial-gradient(ellipse at 88% 18%,rgba(118,33,61,.36),transparent 39%),

/* ===== MORFO · sistema de identidad visual oficial ===== */
:root{
  --vino:#5A1028;              /* Vino de colección */
  --vino-profundo:#350817;     /* Vino profundo */
  --borgona:#76213D;           /* Borgoña */
  --carbon:#343033;            /* Carbón grisáceo */
  --gris-mineral:#777276;      /* Gris mineral */
  --gris-claro:#E9E5E1;        /* Gris claro — corregido desde la transcripción */
  --marfil:#F8F5EF;             /* Claridad y espacio — corregido desde la transcripción */
  --oro:#C9A65C;               /* Oro envejecido */
  --tinta:#343033;
  --serif:"Libre Baskerville", Baskerville, "Baskerville Old Face", Georgia, serif;
  --sans:"Work Sans", "Helvetica Neue", Arial, sans-serif;
}
html{background:var(--marfil)}
body{
  color:var(--carbon);
  background-color:var(--marfil);
  background-image:linear-gradient(135deg,rgba(90,16,40,.018) 25%,transparent 25%,transparent 50%,rgba(90,16,40,.018) 50%,rgba(90,16,40,.018) 75%,transparent 75%,transparent);
  background-size:18px 18px;
  font-family:var(--sans);
}
h1,h2,h3,.brand,.brand-word,.card h3,#faq summary,blockquote{
  font-family:var(--serif);
}
h1,h2,h3{letter-spacing:-.035em}
header.top{background:rgba(52,48,51,.97);border-bottom-color:rgba(201,166,92,.42)}
.brand,.brand-word{color:var(--oro)}

.btn:hover{background:var(--borgona)}
.hero{
  background:
    radial-gradient(ellipse at 78% 38%,rgba(201,166,92,.12),transparent 32%),
    radial-gradient(ellipse at 12% 88%,rgba(90,16,40,.07),transparent 36%),
    linear-gradient(125deg,#F8F5EF 0%,#E9E5E1 100%);
  overflow:hidden;
}
.hero:before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.24;
  background:repeating-linear-gradient(0deg,transparent 0 5px,rgba(52,48,51,.025) 5px 6px);
}
.hero .wrap{position:relative;z-index:1}
.hero h1{color:var(--vino-profundo);letter-spacing:-.055em}

.hero-logo:before{border-color:rgba(201,166,92,.55)}
.hero-logo img{background:transparent!important;mix-blend-mode:multiply;filter:drop-shadow(0 10px 14px rgba(53,8,23,.09))}
.hero-signature{color:var(--gris-mineral)}
#destacada{background:linear-gradient(145deg,var(--marfil),var(--gris-claro))}
#obras{background:linear-gradient(180deg,#E9E5E1 0%,#F8F5EF 100%)!important}
#obras .wrap>h2:after,#subastas h2:after,#faq h2:after,#contacto h2:after{background:var(--oro)}
.frame{background:linear-gradient(145deg,#E9E5E1,#F8F5EF 55%,#d9d0c7);border-color:rgba(119,114,118,.3)}
.frame:before{background:rgba(248,245,239,.88);color:var(--vino)}
.badge{border-color:var(--oro);color:var(--vino)}
.card:after{border-color:var(--oro);color:var(--vino)}
#artista.dark{background:radial-gradient(ellipse at 0% 100%,rgba(118,33,61,.7) 0%,transparent 48%),linear-gradient(125deg,var(--carbon),var(--vino-profundo))}

#subastas .empty{background:linear-gradient(125deg,#F8F5EF,#E9E5E1);border-color:rgba(201,166,92,.65)}

#contacto{background:linear-gradient(135deg,#E9E5E1,#F8F5EF)}
input,textarea,select{background:#fffdf9;border-color:rgba(119,114,118,.48)}
input:focus,textarea:focus,select:focus{border-color:var(--borgona);box-shadow:0 0 0 3px rgba(118,33,61,.1)}

/* ===== Catálogo: añadir obras aquí (luego vendrá del panel de administración) =====
   status: exposicion | disponible | subasta | vendida
   images: rutas de fotografías auténticas, p. ej. ["assets/obras/el-testigo-1.jpg"]
   Campos sin confirmar se omiten: no se muestran en la ficha. */
const WORKS=[{
  slug:"el-testigo", title:"El testigo", status:"exposicion", images:[],
  year:{es:"Agosto de 2026",en:"August 2026"},
  tech:{es:"Óleo sobre lienzo",en:"Oil on canvas"},
  dims:{es:"Aprox. 50–60 cm de alto × 40 cm de ancho × 3–5 cm de profundidad",en:"Approx. 50–60 cm high × 40 cm wide × 3–5 cm deep"},
  state:{es:"Terminada, sin daños visibles",en:"Finished, no visible damage"},
  sign:{es:"Firmada",en:"Signed"},
  story:{
    es:"“El testigo” se pintó en una etapa de frustración y ansiedad intensa. Su nombre viene de que la obra acompañó a la artista en momentos difíciles. Representa el valor de la pintura como testimonio emocional.",
    en:"“El testigo” (The Witness) was painted during a period of frustration and intense anxiety. Its name comes from the way the work stayed with the artist through difficult moments. It stands for painting as emotional testimony."}
}];

let lang="es";
const t=k=>T[lang][k]||k;
const L=o=>typeof o==="string"?o:o[lang];

function frame(w,alt){
  if(w.images.length) return '<div class="frame art-frame" data-art-open="'+w.slug+'" role="button" tabindex="0" aria-label="'+t('open_art')+': '+alt+'"><img src="'+w.images[0]+'" alt="'+alt+'" loading="lazy"><span class="frame-explore">'+t('explore_art')+'</span></div>';
  return '<div class="frame" role="img" aria-label="'+t('no_photo')+': '+w.title+'"><span>'+t('no_photo')+'</span></div>';
}
function badge(w){return `<span class="badge">${t('st_'+w.status)}</span>`}

function renderHome(){
  const w=WORKS[0];
  document.getElementById("featured").innerHTML=`
    ${frame(w,w.title)}
    <div>
      <h2>${w.title}</h2>
      <p class="meta">${L(w.tech)} · ${L(w.year)}</p>
      ${badge(w)}
      <p style="margin-bottom:1.5rem">${L(w.story)}</p>
      <a class="btn" href="#/obra/${w.slug}">${t('feat_link')}</a>
    </div>`;
  document.getElementById("catalog").innerHTML=WORKS.map(x=>
    '<article class="card">'+frame(x,x.title)+
    '<a class="card-link" href="#/obra/'+x.slug+'"><h3>'+x.title+'</h3>'+
    '<p>'+L(x.tech)+' · '+L(x.year)+'</p><p style="margin-top:.4rem">'+badge(x)+'</p></a></article>'
  ).join("");
  if(window.morfoRefreshMotion) window.morfoRefreshMotion();
}
function renderDetail(slug){
  const w=WORKS.find(x=>x.slug===slug); if(!w) return false;
  const rows=[["f_year",w.year],["f_tech",w.tech],["f_support",w.support],["f_dims",w.dims],["f_state",w.state],["f_sign",w.sign]]
    .filter(r=>r[1]).map(r=>`<dt>${t(r[0])}</dt><dd>${L(r[1])}</dd>`).join("");
  document.getElementById("detail-body").innerHTML=`
    <a class="back" href="#obras">${t('back')}</a>
    <div class="sheet">
      ${frame(w,w.title)}
      <div>
        <h1>${w.title}</h1>
        ${badge(w)}
        <dl>${rows}</dl>
        <div class="story"><h2>${t('story')}</h2><p>${L(w.story)}</p>
        <p class="note">${t('draft')}</p></div>
      </div>
    </div>`;
  document.title=`${w.title} — MORFO art`;
  return true;
}
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i18n]").forEach(e=>e.textContent=t(e.dataset.i18n));
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
  renderHome(); route();
}
function route(){
  const m=location.hash.match(/^#\/obra\/(.+)$/);
  if(m && renderDetail(m[1])){document.body.classList.add("in-detail");window.scrollTo(0,0)}
  else{document.body.classList.remove("in-detail");document.title="MORFO art — "+(lang==="es"?"Galería virtual":"Virtual gallery")}
}
window.addEventListener("hashchange",route);
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>{lang=b.dataset.lang;applyLang()}));

/* Menú móvil */
const menu=document.querySelector(".menu"),nav=document.getElementById("nav");
menu.addEventListener("click",()=>{const o=nav.classList.toggle("open");menu.setAttribute("aria-expanded",o)});
nav.addEventListener("click",e=>{if(e.target.tagName==="A"){nav.classList.remove("open");menu.setAttribute("aria-expanded","false")}});

/* Formularios de demostración: validan, no envían nada (requieren backend) */
document.querySelectorAll("form[data-demo]").forEach(f=>f.addEventListener("submit",e=>{
  e.preventDefault();
  const msg=f.querySelector("[data-msg]")||f.parentElement.querySelector("[data-msg]");
  if(f.querySelector("input.hp").value) return;           // trampa antispam básica
  msg.textContent=f.checkValidity()?t("demo_ok"):t("demo_err");
  if(f.checkValidity()) f.reset();
}));

applyLang();

/* ===== Microinteracciones premium; se desactivan con movimiento reducido ===== */
(function(){
  const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const header=document.querySelector('header.top');
  const progress=document.getElementById('reading-progress');
  const updateScroll=()=>{
    const max=document.documentElement.scrollHeight-window.innerHeight;
    progress.style.width=(max>0?(window.scrollY/max)*100:0)+'%';
    header.classList.toggle('scrolled',window.scrollY>18);
  };
  window.addEventListener('scroll',updateScroll,{passive:true});
  updateScroll();

  if(!reduced){
    document.body.classList.add('js-motion');
    let revealObserver=null;
    const refreshMotion=()=>{
      const targets=document.querySelectorAll('section h2, .feat, .grid .card, .artist blockquote, .artist > div, #subastas .empty, #faq details, .contact > *');
      if(!('IntersectionObserver' in window)){targets.forEach(el=>el.classList.add('is-visible'));return}
      if(!revealObserver) revealObserver=new IntersectionObserver(entries=>entries.forEach(entry=>{
        if(entry.isIntersecting){entry.target.classList.add('is-visible');revealObserver.unobserve(entry.target)}
      }),{threshold:.12,rootMargin:'0px 0px -35px 0px'});
      targets.forEach((el,i)=>{
        if(el.dataset.morfoReveal) return;
        el.dataset.morfoReveal='1';el.classList.add('reveal');
        if(i%4===1)el.classList.add('reveal-delay-1');
        if(i%4===2)el.classList.add('reveal-delay-2');
        if(i%4===3)el.classList.add('reveal-delay-3');
        revealObserver.observe(el);
      });
    };
    window.morfoRefreshMotion=refreshMotion;
    refreshMotion();
    const hero=document.querySelector('.hero');
    hero.addEventListener('pointermove',e=>{
      const r=hero.getBoundingClientRect();
      hero.style.setProperty('--pointer-x',(e.clientX-r.left)+'px');
      hero.style.setProperty('--pointer-y',(e.clientY-r.top)+'px');
    },{passive:true});
  }
})();

</script>
